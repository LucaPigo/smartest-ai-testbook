openapi: 3.0.3
info:
  title: Smartest AI Testbook API
  version: 1.0.0
  description: HTTP contract for the Smartest AI Testbook web application.
tags:
  - name: Health
    description: Server connectivity.
  - name: Test Creation
    description: Manage suites, tests and their expectations.
  - name: Execution
    description: Create and inspect evaluation runs.
  - name: Reporting
paths:
  # Health
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check server connectivity
      responses:
        '200':
          description: The server is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  # Test Creation
  /api/test-suites:
    get:
      operationId: listTestSuites
      tags: [Test Creation]
      responses:
        '200':
          description: Test suites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestSuite'
    post:
      operationId: createTestSuite
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteInput'
      responses:
        '201':
          description: Created test suite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuite'
        '422':
          description: Invalid suite input
  /api/test-suites/{suite-id}:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    put:
      operationId: updateTestSuite
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSuiteInput'
      responses:
        '200':
          description: Updated test suite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuite'
        '404':
          description: Test suite not found
        '422':
          description: Invalid suite input
    delete:
      operationId: deleteTestSuite
      description: Deletes the suite, its tests, expectations, and run history.
      tags: [Test Creation]
      responses:
        '204':
          description: Test suite deleted
        '404':
          description: Test suite not found
  /api/test-suites/{suite-id}/test-cases:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    get:
      operationId: listSuiteTestCases
      tags: [Test Creation]
      responses:
        '200':
          description: Test cases in the suite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestCase'
        '404':
          description: Test suite not found
  # Execution
  /api/test-suites/{suite-id}/eval-runs:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    get:
      operationId: listSuiteEvalRuns
      tags: [Execution]
      responses:
        '200':
          description: Evaluation runs for the suite
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvalRun'
        '404':
          description: Test suite not found
    post:
      operationId: createEvalRun
      tags: [Execution]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunInput'
      responses:
        '201':
          description: Created evaluation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '404':
          description: Test suite not found
        '422':
          description: Invalid provider, model, or suite configuration
  # Test Creation
  /api/test-cases:
    post:
      operationId: createTestCase
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestCaseInput'
      responses:
        '201':
          description: Created test case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '404':
          description: Test suite not found
        '422':
          description: Invalid test or expectation input
  /api/test-cases/{case-id}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: getTestCase
      tags: [Test Creation]
      responses:
        '200':
          description: Test case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '404':
          description: Test case not found
    put:
      operationId: updateTestCase
      description: Replaces the test definition. Existing expectation IDs remain unchanged; historical run results are not modified.
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestCaseInput'
      responses:
        '200':
          description: Updated test case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '404':
          description: Test case not found
        '422':
          description: Invalid test or expectation input
    delete:
      operationId: deleteTestCase
      tags: [Test Creation]
      responses:
        '204':
          description: Test case deleted
        '404':
          description: Test case not found
  /api/test-cases/{case-id}/expectations:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      operationId: listTestCaseExpectations
      tags: [Test Creation]
      responses:
        '200':
          description: Expectations for the test case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expectation'
        '404':
          description: Test case not found
  /api/expectations:
    post:
      operationId: createExpectation
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpectationInput'
      responses:
        '201':
          description: Created expectation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expectation'
        '404':
          description: Test case not found
        '422':
          description: Invalid expectation input
  /api/expectations/{expectation-id}:
    parameters:
      - $ref: '#/components/parameters/ExpectationId'
    put:
      operationId: updateExpectation
      tags: [Test Creation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectationInput'
      responses:
        '200':
          description: Updated expectation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expectation'
        '404':
          description: Expectation not found
        '422':
          description: Invalid expectation input
  # Execution
  /api/eval-runs/{eval-run-id}:
    parameters:
      - $ref: '#/components/parameters/EvalRunId'
    get:
      operationId: getEvalRun
      tags: [Reporting]
      responses:
        '200':
          description: Evaluation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '404':
          description: Evaluation run not found
components:
  parameters:
    SuiteId:
      name: suite-id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: case-id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExpectationId:
      name: expectation-id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvalRunId:
      name: eval-run-id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    TestSuiteInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    TestSuite:
      type: object
      required: [id, name, tests]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        tests:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
    TestCaseInput:
      type: object
      required: [title, prompt, expectations]
      properties:
        title: { type: string, minLength: 1, pattern: '\S' }
        prompt: { type: string, minLength: 1 }
        variables:
          type: object
          default: {}
          additionalProperties: { type: string }
        expectations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Expectation'
    CreateTestCaseInput:
      type: object
      required: [suite_id, title, prompt, expectations]
      properties:
        suite_id: { type: string, format: uuid, description: Suite to which the new test case is added. }
        title: { type: string, minLength: 1, pattern: '\S' }
        prompt: { type: string, minLength: 1 }
        variables:
          type: object
          default: {}
          additionalProperties: { type: string }
        expectations:
          description: Expectations created with the test case. Their IDs are assigned by the system.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExpectationInput'
    TestCase:
      allOf:
        - $ref: '#/components/schemas/TestCaseInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    ExpectationInput:
      type: object
      required: [name, evaluator_type, threshold, options]
      properties:
        name: { type: string, minLength: 1 }
        evaluator_type: { type: string, enum: [exactMatch, semanticSimilarity, llmJudge] }
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Minimum passing score on the fixed 0–1 scale. Exact match requires 1.
        options:
          type: object
          additionalProperties: true
          description: 'Exactly one nonblank string: expected for exactMatch or semanticSimilarity, rubric for llmJudge. Other fields are rejected.'
          example: { expected: Paris }
    CreateExpectationInput:
      allOf:
        - $ref: '#/components/schemas/ExpectationInput'
        - type: object
          required: [test_case_id]
          properties:
            test_case_id: { type: string, format: uuid, description: Test case to which the new expectation is added. }
    Expectation:
      allOf:
        - $ref: '#/components/schemas/ExpectationInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    EvalRunInput:
      type: object
      required: [provider_name, model_name]
      properties:
        provider_name: { type: string }
        model_name: { type: string }
    EvalRun:
      type: object
      required: [id, suite_id, started_at, provider_name, model_name, results]
      properties:
        id: { type: string, format: uuid }
        suite_id: { type: string }
        started_at: { type: string, format: date-time }
        provider_name: { type: string }
        model_name: { type: string }
        results:
          type: array
          items:
            $ref: '#/components/schemas/EvalResult'
    EvalResult:
      type: object
      required: [test_id, prompt, output, error, scores, passed]
      properties:
        test_id: { type: string }
        prompt: { type: string }
        output: { type: string, nullable: true }
        error: { type: string, nullable: true }
        passed: { type: boolean, readOnly: true }
        scores:
          type: array
          items:
            $ref: '#/components/schemas/EvalScore'
    EvalScore:
      type: object
      required: [feedback, passed, expectation_id, expectation_name, evaluator_type, threshold, value, scale_min, scale_max, error]
      properties:
        feedback: { type: string }
        passed: { type: boolean }
        expectation_id: { type: string, nullable: true }
        expectation_name: { type: string, nullable: true }
        evaluator_type: { type: string, nullable: true }
        threshold: { type: number, nullable: true }
        value: { type: number, nullable: true }
        scale_min: { type: number, nullable: true }
        scale_max: { type: number, nullable: true }
        error: { type: string, nullable: true }
