openapi: 3.0.3
info:
  title: Smartest AI Testbook Domain API
  version: 1.0.0
  description: |
    Proposed product-oriented contract based on the domain design. These
    operations are not yet implemented. A suite can be created empty, but
    execution requires at least one valid test. Runs complete before the
    execution request returns. Reports are generated from completed runs.
tags:
  - name: Test Creation
    description: Define suites, tests and their expectations.
  - name: Execution
    description: Run suites and inspect completed runs.
  - name: Reporting
    description: Generate reports from completed runs.
  - name: Exporting
    description: Export suites with their run history.
paths:
  # Test Creation
  /api/test-suites:
    get:
      operationId: listTestSuites
      tags: [Test Creation]
      summary: List test suites
      responses:
        '200':
          description: Test suites with their test definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TestSuite' }
    post:
      operationId: createTestSuite
      tags: [Test Creation]
      summary: Create an empty test suite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestSuiteInput' }
      responses:
        '201':
          description: Created suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSuite' }
        '400': { description: Invalid suite definition }
  /api/test-suites/{suiteId}:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    get:
      operationId: getTestSuite
      tags: [Test Creation]
      summary: Retrieve a suite and its tests
      responses:
        '200':
          description: Test suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSuite' }
        '404': { description: Suite not found }
    put:
      operationId: updateTestSuite
      tags: [Test Creation]
      summary: Update suite details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestSuiteInput' }
      responses:
        '200':
          description: Updated suite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestSuite' }
        '400': { description: Invalid suite definition }
        '404': { description: Suite not found }
  /api/test-suites/{suiteId}/tests:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    post:
      operationId: addTest
      tags: [Test Creation]
      summary: Define a test and add it to a suite
      description: A new test must include at least one initial expectation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTestInput' }
      responses:
        '201':
          description: Created test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { description: Invalid test or evaluation criteria }
        '404': { description: Suite not found }
  /api/test-suites/{suiteId}/tests/{testId}:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
      - $ref: '#/components/parameters/TestId'
    get:
      operationId: getTest
      tags: [Test Creation]
      summary: Retrieve a test definition
      responses:
        '200':
          description: Test definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '404': { description: Suite or test not found }
    put:
      operationId: updateTest
      tags: [Test Creation]
      summary: Update test inputs
      description: |
        Expectations remain unchanged and must be compatible with the updated
        criteria. The test ID and existing run results remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestInput' }
      responses:
        '200':
          description: Updated test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Test' }
        '400': { description: Invalid test or evaluation criteria }
        '404': { description: Suite or test not found }
  # Test expectations
  /api/test-suites/{suiteId}/tests/{testId}/expectations:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
      - $ref: '#/components/parameters/TestId'
    get:
      operationId: listExpectations
      tags: [Test Creation]
      summary: List expectations for a test
      responses:
        '200':
          description: Test expectations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Expectation' }
        '404': { description: Suite or test not found }
    post:
      operationId: addExpectation
      tags: [Test Creation]
      summary: Add an expectation to a test
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Expectation' }
      responses:
        '201':
          description: Added expectation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expectation' }
        '400': { description: Invalid expectation or incompatible test criteria }
        '404': { description: Suite or test not found }
        '409': { description: Expectation ID already exists in the test }
  /api/test-suites/{suiteId}/tests/{testId}/expectations/{expectationId}:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
      - $ref: '#/components/parameters/TestId'
      - $ref: '#/components/parameters/ExpectationId'
    get:
      operationId: getExpectation
      tags: [Test Creation]
      summary: Retrieve an expectation
      responses:
        '200':
          description: Expectation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expectation' }
        '404': { description: 'Suite, test or expectation not found' }
    put:
      operationId: updateExpectation
      tags: [Test Creation]
      summary: Replace an expectation's configuration
      description: The expectation ID and existing run results remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectationInput' }
      responses:
        '200':
          description: Updated expectation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expectation' }
        '400': { description: Invalid expectation or incompatible test criteria }
        '404': { description: 'Suite, test or expectation not found' }
    delete:
      operationId: deleteExpectation
      tags: [Test Creation]
      summary: Remove an expectation from a test
      description: A test must retain at least one expectation.
      responses:
        '204': { description: Expectation removed }
        '404': { description: 'Suite, test or expectation not found' }
        '409': { description: The last expectation cannot be removed }
  # Execution
  /api/test-suites/{suiteId}/runs:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    get:
      operationId: listSuiteRuns
      tags: [Execution]
      summary: Retrieve the stored run history of a suite
      responses:
        '200':
          description: Completed runs, including results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EvalRun' }
        '404': { description: Suite not found }
    post:
      operationId: runSuite
      tags: [Execution]
      summary: Execute a suite against a model
      description: |
        Executes all tests and returns the completed run. Provider and evaluator
        failures are recorded in individual results without stopping other tests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInput' }
      responses:
        '201':
          description: Completed run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRun' }
        '400': { description: Empty suite or invalid provider or model selection }
        '404': { description: Suite not found }
  /api/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [Execution]
      summary: Retrieve a completed run
      responses:
        '200':
          description: Run and recorded results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalRun' }
        '404': { description: Run not found }
  # Reporting
  /api/runs/{runId}/report:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunReport
      tags: [Reporting]
      summary: Generate a report from a completed run
      responses:
        '200':
          description: Snapshot of the run results without aggregate scores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalReport' }
        '404': { description: Run not found }
  # Exporting
  /api/test-suites/{suiteId}/export:
    parameters:
      - $ref: '#/components/parameters/SuiteId'
    get:
      operationId: exportSuite
      tags: [Exporting]
      summary: Export a suite and its complete run history
      description: Export is available even when the suite has no runs.
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiteExport' }
        '404': { description: Suite not found }
components:
  parameters:
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema: { type: string }
    TestId:
      name: testId
      in: path
      required: true
      schema: { type: string }
    ExpectationId:
      name: expectationId
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string }
  schemas:
    TestSuiteInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    TestSuite:
      allOf:
        - $ref: '#/components/schemas/TestSuiteInput'
        - type: object
          required: [id, tests]
          properties:
            id: { type: string }
            tests:
              type: array
              items: { $ref: '#/components/schemas/Test' }
    TestInput:
      type: object
      required: [prompt, variables, goldenReference, rubric]
      description: Selected evaluators may require a golden reference or rubric.
      properties:
        prompt: { type: string, minLength: 1 }
        variables:
          type: object
          additionalProperties: { type: string }
        goldenReference: { type: string, nullable: true }
        rubric: { type: string, nullable: true }
    CreateTestInput:
      allOf:
        - $ref: '#/components/schemas/TestInput'
        - type: object
          required: [expectations]
          properties:
            expectations:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Expectation' }
    Test:
      allOf:
        - $ref: '#/components/schemas/CreateTestInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    ExpectationInput:
      type: object
      required: [name, evaluatorType, threshold, options]
      properties:
        name: { type: string }
        evaluatorType: { type: string }
        threshold: { type: number, description: Minimum passing score on the evaluator's scale. }
        options: { type: object, additionalProperties: true }
    Expectation:
      allOf:
        - $ref: '#/components/schemas/ExpectationInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, description: Stable identifier of this expectation. }
    RunInput:
      type: object
      required: [providerName, modelName]
      properties:
        providerName: { type: string }
        modelName: { type: string }
    EvalRun:
      type: object
      required: [id, suiteId, startedAt, providerName, modelName, results]
      properties:
        id: { type: string }
        suiteId: { type: string }
        startedAt: { type: string, format: date-time }
        providerName: { type: string }
        modelName: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/EvalResult' }
    EvalResult:
      type: object
      required: [testId, prompt, output, error, passed, scores]
      description: |
        A test passes when execution succeeds and all expectations pass.
        A provider error leaves output null and scores empty.
      properties:
        testId: { type: string }
        prompt: { type: string, description: Prompt template used for this run. }
        output: { type: string, nullable: true }
        error: { type: string, nullable: true }
        passed: { type: boolean }
        scores:
          type: array
          items: { $ref: '#/components/schemas/EvalScore' }
    EvalScore:
      type: object
      required: [expectationId, expectationName, evaluatorType, threshold, value, scaleMin, scaleMax, passed, feedback, error]
      description: An evaluator error produces a failed score without a value or scale.
      properties:
        expectationId: { type: string }
        expectationName: { type: string }
        evaluatorType: { type: string }
        threshold: { type: number }
        value: { type: number, nullable: true }
        scaleMin: { type: number, nullable: true }
        scaleMax: { type: number, nullable: true }
        passed: { type: boolean }
        feedback: { type: string }
        error: { type: string, nullable: true }
    EvalReport:
      type: object
      required: [id, suiteId, startedAt, providerName, modelName, results]
      description: Independent snapshot of run metadata and recorded results.
      properties:
        id: { type: string, description: Identifier of the run represented by this report. }
        suiteId: { type: string }
        startedAt: { type: string, format: date-time }
        providerName: { type: string }
        modelName: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/EvalResult' }
    SuiteExport:
      type: object
      required: [suite, runs]
      properties:
        suite: { $ref: '#/components/schemas/TestSuite' }
        runs:
          type: array
          items: { $ref: '#/components/schemas/EvalRun' }
